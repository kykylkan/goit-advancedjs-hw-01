<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Image Gallery</title>
  <link rel="stylesheet" href="../node_modules/simplelightbox/dist/simple-lightbox.min.css" />
  <style>
    .gallery {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 0;
    }
    .gallery-item {
      flex-basis: calc(25% - 10px);
    }
    .gallery-image {
      width: 100%;
      display: block;
      height: auto;
    }
  
    .gallery {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      padding: 0;
      margin: 0 auto;
      max-width: 1024px;
    }
    .gallery-item {
      overflow: hidden;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }
    .gallery-image {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.3s ease;
    }
    .gallery-image:hover {
      transform: scale(1.03);
    }
    .sl-overlay {
      background: #2E2F42CC !important;
    }
  </style>
</head>
<body>
  <ul class="gallery"></ul>
  <script type="module" src="./js/1-gallery.js"></script>
</body>
</html>
